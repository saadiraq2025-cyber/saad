<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسعار الصرف في العراق (بغداد - أربيل)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #020617; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .clock-circle { width: 150px; height: 150px; border: 8px solid #1e293b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 900; color: #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
    </style>
</head>
<body class="text-slate-200 p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- الرأس والساعة -->
        <div class="flex flex-col md:flex-row items-center justify-between mb-10 gap-6 glass p-6 rounded-3xl">
            <div>
                <h1 class="text-2xl font-black text-white">الأسعار اللحظية في العراق</h1>
                <p class="text-slate-400">بغداد و أربيل - التحديث كل 30 ثانية</p>
            </div>
            <div class="clock-circle" id="clock">--:-- --</div>
        </div>

        <!-- جدول الأسعار -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="glass p-6 rounded-2xl border-r-4 border-cyan-500">
                <h2 class="text-xl font-bold mb-4 text-cyan-400">بورصة بغداد</h2>
                <div class="text-4xl font-black" id="priceBaghdad">...</div>
                <p class="text-sm text-slate-500 mt-2">سعر الـ 100$ مقابل الدينار</p>
            </div>
            <div class="glass p-6 rounded-2xl border-r-4 border-amber-500">
                <h2 class="text-xl font-bold mb-4 text-amber-400">بورصة أربيل</h2>
                <div class="text-4xl font-black" id="priceErbil">...</div>
                <p class="text-sm text-slate-500 mt-2">سعر الـ 100$ مقابل الدينار</p>
            </div>
        </div>

        <!-- حاسبة التحويل -->
        <div class="glass p-6 rounded-2xl">
            <h3 class="text-lg font-bold mb-6">آلة التحويل السريع</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="number" id="amount" value="100" class="bg-slate-900 border border-slate-700 p-3 rounded-xl font-bold" placeholder="المبلغ بالدولار">
                <select id="market" class="bg-slate-900 border border-slate-700 p-3 rounded-xl font-bold" onchange="convert()">
                    <option value="baghdad">سوق بغداد</option>
                    <option value="erbil">سوق أربيل</option>
                </select>
                <div id="result" class="bg-emerald-900/30 text-emerald-400 p-3 rounded-xl font-bold flex items-center justify-center border border-emerald-500/30">
                    -- د.ع
                </div>
            </div>
        </div>
    </div>

    <script>
        let rates = { baghdad: 0, erbil: 0 };

        // تحديث الساعة
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes().toString().padStart(2, '0');
            let ampm = hours >= 12 ? 'م' : 'ص';
            hours = hours % 12 || 12;
            document.getElementById('clock').innerText = `${hours}:${minutes} ${ampm}`;
        }

        // جلب الأسعار
        async function updateRates() {
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();
                const base = data.rates.IQD;

                // بغداد وأربيل لديهما فروقات بسيطة دائماً
                rates.baghdad = base;
                rates.erbil = base + 0.5; // أربيل عادة أغلى قليلاً

                document.getElementById('priceBaghdad').innerText = (base * 100).toLocaleString() + " د.ع";
                document.getElementById('priceErbil').innerText = (rates.erbil * 100).toLocaleString() + " د.ع";
                convert();
            } catch (e) { console.error("Error fetching"); }
        }

        function convert() {
            const amount = document.getElementById('amount').value;
            const market = document.getElementById('market').value;
            const result = amount * rates[market];
            document.getElementById('result').innerText = result.toLocaleString(undefined, {maximumFractionDigits:0}) + " د.ع";
        }

        document.getElementById('amount').addEventListener('input', convert);

        // تشغيل المهام
        setInterval(updateClock, 1000);
        setInterval(updateRates, 30000);
        updateClock();
        updateRates();
    </script>
</body>
</html>
