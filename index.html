<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكتك بغداد</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: #e9ecef; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .app-container { 
            background-color: white; 
            width: 100%; 
            max-width: 400px; 
            height: 100vh; 
            max-height: 700px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            position: relative; 
        }
        .header { 
            background-color: #ffcc00; 
            padding: 20px; 
            text-align: center; 
            font-size: 24px; 
            font-weight: bold; 
            color: #212529; 
            border-bottom: 3px solid #212529;
        }
        .content { 
            padding: 25px 20px; 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .btn { 
            background-color: #212529; 
            color: #ffcc00; 
            padding: 15px; 
            border: none; 
            border-radius: 8px; 
            font-size: 18px; 
            cursor: pointer; 
            text-align: center; 
            font-weight: bold; 
            width: 100%; 
            transition: 0.3s;
        }
        .btn:hover { background-color: #343a40; }
        .btn-yellow { background-color: #ffcc00; color: #212529; }
        .btn-yellow:hover { background-color: #e0b400; }
        input { 
            padding: 15px; 
            border: 1px solid #ced4da; 
            border-radius: 8px; 
            font-size: 16px; 
            width: 100%; 
            box-sizing: border-box; 
            font-family: 'Tajawal', sans-serif;
        }
        input:focus { outline: none; border-color: #ffcc00; box-shadow: 0 0 5px rgba(255, 204, 0, 0.5); }
        .hidden { display: none !important; }
        .status { text-align: center; padding: 10px; font-weight: bold; margin-top: 10px; }
        .request-card {
            border: 2px dashed #ffcc00; 
            padding: 15px; 
            border-radius: 8px; 
            background-color: #fffdf0;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">🛺 تكتك بغداد</div>
        
        <div id="roleSelection" class="content">
            <h3 style="text-align: center; color: #333;">أهلاً بك!</h3>
            <p style="text-align: center; color: #666; margin-bottom: 20px;">حدد طريقة استخدامك للتطبيق:</p>
            <button class="btn" onclick="showScreen('passengerScreen')">🙋‍♂️ أريد تكتك (راكب)</button>
            <button class="btn btn-yellow" onclick="showScreen('driverScreen')">🛺 أنا سائق تكتك</button>
        </div>

        <div id="passengerScreen" class="content hidden">
            <h3 style="color: #333;">طلب رحلة جديدة</h3>
            <input type="text" id="pickup" placeholder="نقطة الانطلاق (مثال: الكرادة داخل)">
            <input type="text" id="dropoff" placeholder="الوجهة (مثال: مول منصور)">
            <button class="btn btn-yellow" onclick="requestRide()">اطلب الآن</button>
            <div id="passengerStatus" class="status"></div>
            <button class="btn" style="margin-top: auto; background-color: #e9ecef; color: #333;" onclick="showScreen('roleSelection')">رجوع</button>
        </div>

        <div id="driverScreen" class="content hidden">
            <h3 style="color: #333;">لوحة الكابتن</h3>
            <button class="btn btn-yellow" id="onlineBtn" onclick="toggleOnline()">🔴 غير متاح (مطفأ)</button>
            
            <div id="driverRequests" class="request-card hidden">
                <h4 style="margin-top: 0; color: #d9534f;">🚨 طلب جديد!</h4>
                <p><strong>من:</strong> <span id="req-pickup">الكرادة داخل</span></p>
                <p><strong>إلى:</strong> <span id="req-dropoff">مول منصور</span></p>
                <p><strong>المسافة:</strong> 4 كم (تقريباً 3000 دينار)</p>
                <button class="btn btn-yellow" onclick="acceptRide()">قبول الطلب</button>
            </div>
            
            <div id="driverStatus" class="status"></div>
            <button class="btn" style="margin-top: auto; background-color: #e9ecef; color: #333;" onclick="showScreen('roleSelection')">تسجيل خروج</button>
        </div>
    </div>

    <script>
        // دالة التنقل بين الشاشات
        function showScreen(screenId) {
            document.getElementById('roleSelection').classList.add('hidden');
            document.getElementById('passengerScreen').classList.add('hidden');
            document.getElementById('driverScreen').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
            
            // إعادة ضبط الحالات عند التنقل
            document.getElementById('passengerStatus').innerHTML = '';
            document.getElementById('pickup').value = '';
            document.getElementById('dropoff').value = '';
        }

        // دالة محاكاة طلب التكتك (الراكب)
        function requestRide() {
            const pickup = document.getElementById('pickup').value;
            const dropoff = document.getElementById('dropoff').value;
            const statusDiv = document.getElementById('passengerStatus');

            if(!pickup || !dropoff) {
                statusDiv.innerHTML = "<span style='color: #d9534f;'>يرجى تحديد الانطلاق والوجهة!</span>";
                return;
            }

            statusDiv.innerHTML = "جاري البحث عن أقرب تكتك... ⏳";
            
            // محاكاة تأخير الشبكة ثم العثور على سائق
            setTimeout(() => {
                statusDiv.innerHTML = "<span style='color: #28a745;'>✅ تم العثور على كابتن! (أبو كرار) في طريقه إليك. التكتك رقم: 1234 بغداد</span>";
            }, 3000);
        }

        // دالة تغيير حالة السائق (متاح/غير متاح)
        let isOnline = false;
        function toggleOnline() {
            isOnline = !isOnline;
            const btn = document.getElementById('onlineBtn');
            const requestsDiv = document.getElementById('driverRequests');
            const statusDiv = document.getElementById('driverStatus');

            if(isOnline) {
                btn.innerHTML = "🟢 متاح (جاري البحث عن ركاب...)";
                btn.style.backgroundColor = "#28a745";
                btn.style.color = "white";
                statusDiv.innerHTML = "";
                
                // محاكاة وصول طلب للسائق بعد 4 ثوانٍ
                setTimeout(() => {
                    if(isOnline) {
                        requestsDiv.classList.remove('hidden');
                    }
                }, 4000);
            } else {
                btn.innerHTML = "🔴 غير متاح (مطفأ)";
                btn.style.backgroundColor = "#ffcc00";
                btn.style.color = "#212529";
                requestsDiv.classList.add('hidden');
                statusDiv.innerHTML = "";
            }
        }

        // دالة قبول الطلب (السائق)
        function acceptRide() {
            document.getElementById('driverRequests').classList.add('hidden');
            document.getElementById('driverStatus').innerHTML = "<span style='color: #28a745;'>✅ تم قبول الطلب! اتبع الخريطة للوصول إلى الراكب.</span>";
        }
    </script>
</body>
</html>
